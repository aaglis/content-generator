services:
  postgres:
    image: postgres:16-alpine
    container_name: vcf-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vcf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vcf}
      POSTGRES_DB: ${POSTGRES_DB:-viral_content_factory}
    volumes:
      - vcf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vcf} -d ${POSTGRES_DB:-viral_content_factory}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vcf-postgres-data:
